<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- The mark from src/components/brand/logo.tsx, with the dark-theme brand colours baked
       in: a file served as a favicon has no page to read CSS variables from. Keep the two in
       step by hand. -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5bff"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="14" fill="url(#f)"/>
  <rect width="48" height="48" rx="14" fill="url(#s)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="13.25" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>
  <rect x="10" y="29" width="5.5" height="11" rx="2.75" fill="#fff" fill-opacity="0.5"/>
  <rect x="21.25" y="23" width="5.5" height="17" rx="2.75" fill="#fff" fill-opacity="0.75"/>
  <rect x="32.5" y="17" width="5.5" height="23" rx="2.75" fill="#fff"/>
  <circle cx="35.25" cy="11" r="3" fill="#fff"/>
</svg>
