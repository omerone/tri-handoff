name: Security Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: false

      - name: Generate audit report
        if: always()
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  waf-rules:
    name: WAF Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The rules file is loaded by scripts/deploy-waf.ts. It carried a raw NUL byte where a
      # pattern *for* a NUL byte was meant, which no YAML parser will read — so the file was
      # unloadable and this check had been failing since it was written.
      - name: Validate WAF rules parse
        run: |
          python3 - <<'PY'
          import sys, yaml
          rules = yaml.safe_load(open('docs/WAF_RULES.yaml', encoding='utf-8'))
          count = len(rules.get('rules', []))
          if count == 0:
              sys.exit('WAF_RULES.yaml parsed but declares no rules')
          print(f'WAF rules parse cleanly: {count} rules')
          PY
