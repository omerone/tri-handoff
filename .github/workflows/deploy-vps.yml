name: Deploy to VPS

# Every push to master goes to production, gated on the checks that would
# actually catch a broken deploy: types and the full test suite against a real
# Postgres. The older Deploy workflow builds an image and runs WAF and audit
# checks; this one is deliberately separate so an unrelated red job there can
# never silently stop production from being updated.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# One deploy at a time, and never cancel one midway — a half-applied rollout is
# worse than a queued one.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tri
          POSTGRES_PASSWORD: tri
          POSTGRES_DB: tri
        # 5433 on the host: tests/setup-env.ts defaults DATABASE_URL to that port.
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U tri -d tri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tri:tri@localhost:5433/tri?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # The integration tests talk to a real database, so the schema has to exist
      # before they run.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name != 'pull_request'

    steps:
      - name: Trigger deploy over SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "::error title=Deploy not configured::DEPLOY_SSH_KEY or DEPLOY_HOST is missing."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # The host key is pinned, not learned. `ssh-keyscan` on every run is
          # trust-on-first-use with no first use: it accepts whatever answers on
          # port 22 and writes it down as correct, which is the same as not
          # checking. Anyone able to stand between the runner and the VPS gets a
          # deploy pointed at their machine, and this job would report success.
          #
          # DEPLOY_HOST_KEY holds the server's ed25519 public key, read off the
          # box. A keyscan fallback stays for a host that has not had one set
          # yet, and says so loudly rather than quietly doing the old thing.
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning title=Host key not pinned::DEPLOY_HOST_KEY is unset; trusting whatever answers on port 22."
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          # The key is installed on the server under a forced command, so whatever
          # is passed here is ignored and `tri-deploy` runs instead. It pulls this
          # commit, rebuilds, health-checks the result and rolls back on failure,
          # exiting non-zero if the site did not come up — which fails this job.
          #
          # `ServerAliveInterval` is what makes that last sentence true. `tri-deploy`
          # sends the whole Docker build to its own log file on the server, so this
          # channel carries no traffic for the two minutes the build takes, and an
          # idle connection gets dropped. The client then exits non-zero while the
          # server carries on and finishes the deploy perfectly well — which is how
          # this job spent an evening reporting failures over deploys that had all
          # succeeded, one of them nine seconds after the job gave up on it. A red
          # pipeline that is lying is worse than no pipeline: nobody reads the next
          # failure. Fifteen seconds apart, twenty tolerated, is five minutes of
          # silence before the connection is genuinely considered dead.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o PasswordAuthentication=no \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=20 \
              "$USER@$HOST" deploy

      - name: Confirm production is serving this commit
        run: |
          # The public URL, over TLS and through Cloudflare — the path a client actually
          # takes. The old check hit http://<ip>/login, which is a 301 to the domain now, so
          # it would fail every deploy while the site was perfectly healthy.
          #
          # Retried, because the first request lands seconds after the container swap and has
          # to cross Cloudflare to an app that is still warming. One cold 522 marked two
          # perfectly good deploys as failures — the box's own log said "health check passed"
          # twenty seconds before the pipeline said the site was down. A minute of patience is
          # the difference between a check and a coin flip.
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://troinvest.uk/login)
            echo "attempt $attempt: GET https://troinvest.uk/login -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error title=Production unhealthy::/login never returned 200"
          exit 1
