name: Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tri:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Load image to local Docker daemon for testing
          load: true

      - name: Test Docker image
        run: |
          docker run --rm \
            -e NODE_ENV=production \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
            -e ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}" \
            tri:${{ github.sha }} \
            node -e "console.log('[Docker] Image built successfully')"

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20.9.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test]
    # Only deploy on push to main/master, not on pull requests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "[Deploy] Deploying to production..."
          echo "[Deploy] Using secrets from GitHub Actions"
          echo "[Deploy] Database URL: configured via secret"
          echo "[Deploy] Session secret: configured via secret"
          echo "[Deploy] Encryption key: configured via secret"

          # TODO: Add your actual deployment commands here
          # Example:
          #   - Push image to container registry
          #   - Update Kubernetes deployment
          #   - Trigger deployment pipeline
          #   - Run database migrations
          #   - etc.

          echo "[Deploy] Deployment complete"

  audit:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20.9.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Run type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint
