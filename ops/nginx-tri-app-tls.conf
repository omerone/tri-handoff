# The reverse proxy in front of TRi, once there is a domain and a certificate.
#
# This is `nginx-tri-app.conf` with TLS added. It is a *separate* file rather than an edit
# because installing it before the certificate exists takes the site down: the port-80 block
# below redirects to https, and a redirect to a port nothing is listening on is an error page
# for every visitor. Install this one at cutover, in the order written in ops/README.md.
#
# Install to /etc/nginx/sites-available/tri-app (replacing the plain-HTTP file), symlink into
# sites-enabled, `nginx -t`, reload.
#
# It also needs /etc/nginx/conf.d/cloudflare-realip.conf — see nginx-cloudflare-realip.conf in
# this directory. Without it every visitor arrives as a Cloudflare address and the per-IP
# rate limits stop meaning anything.
#
# The Caddyfile in caddy/ is the same proxy for the compose stack and carries the same three
# protections. Nothing warns you when the two disagree: the site serves 200s either way, and
# what changes is who gets to choose the tenant and whose address ends up in the audit trail.
# Change one, read the other.

# ---------------------------------------------------------------------------
# HTTPS — every tenant domain, one block.
#
# `server_name _;` is deliberate and mirrors the Caddyfile's `https://` with no host matcher.
# TRi is multi-tenant: every client domain is served by the same app, which resolves the
# tenant from the Host header and refuses one it does not know. Naming the domains here as
# well would mean editing nginx and reloading it to onboard a client — a second place to
# forget, for no protection the app is not already giving.
#
# Cloudflare only forwards traffic for zones in the account, so in practice this answers the
# domains you have put there and the origin's own address.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Let's Encrypt, issued and renewed through Cloudflare's DNS API — see ops/README.md.
    #
    # DNS-01 rather than the usual HTTP-01: the origin sits behind Cloudflare's proxy, so the
    # ACME server cannot reach port 80 here to answer an HTTP challenge. Proving control of
    # the DNS record instead works from behind any proxy, and it is also the only way to get a
    # wildcard, which is what lets a new client be a row in `tenants` rather than a new
    # certificate.
    #
    # This is the leg between Cloudflare and here. It is only meaningful with SSL/TLS mode
    # "Full (strict)" in the dashboard: on "Flexible" Cloudflare talks plain HTTP to port 80
    # and this file is never used — a padlock in the browser with the password in the clear on
    # the last hop.
    ssl_certificate     /etc/letsencrypt/live/troinvest.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/troinvest.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # A year, and only sent over TLS. Cloudflare can also send this from the edge; having it
    # here too means the header is right even if the edge setting is ever turned off.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # The on-demand TLS "ask" endpoint answers 200 for an active tenant domain and 404 for
    # anything else, which makes it a client-enumeration oracle for anyone who can reach it.
    # It exists for Caddy, which calls it over the compose network and never through a proxy.
    # Nothing on the public internet has any business asking. Blocked before `location /`
    # because a prefix match here beats the generic one.
    location /api/tls/allow {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # https here, which is what makes the app mark the session cookie `Secure`. It reads
        # APP_PROTOCOL rather than this header for that decision, so both have to be right —
        # see ops/README.md.
        proxy_set_header X-Forwarded-Proto $scheme;

        # $remote_addr is the socket peer and cannot be forged. $proxy_add_x_forwarded_for —
        # nginx's usual answer, and what this used to send — *appends* to whatever the client
        # already put in X-Forwarded-For, so a caller could prepend any address they liked and
        # have it read back as theirs. `clientIp()` prefers X-Real-IP and so kept its rate
        # limits, but `startSession` takes the first hop of X-Forwarded-For for the address it
        # files against the session, and that entry was the caller's to write.
        #
        # Behind Cloudflare, `$remote_addr` is the *visitor* rather than the edge only because
        # cloudflare-realip.conf rewrote it from CF-Connecting-IP first. Without that file
        # these two lines faithfully record Cloudflare on every request.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Overwrite, never pass through. `getRequestHost()` reads X-Forwarded-Host to decide
        # which tenant a request belongs to and whether it reached the operator console's
        # hostname; nginx forwards unrecognised client headers verbatim, so without this line
        # the caller chose both by sending the header themselves.
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ---------------------------------------------------------------------------
# HTTP — nothing is served here any more.
#
# Cloudflare's "Always Use HTTPS" should mean this is never reached from a browser, but the
# origin address is public and anything can still knock on port 80 directly. A redirect
# rather than a refusal, so a bookmarked http:// link keeps working.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# The address this was served on before it had a name.
#
# A migration aid, and the one place a tenant hostname is written into the proxy. The generic
# redirect above sends `http://167.233.250.233` to `https://167.233.250.233`, where the
# certificate is for the domain and the browser stops with a name-mismatch error — a dead end
# for anyone whose bookmark or password manager still holds the old address.
#
# Deliberately outside the wildcard: an IP literal never matches `server_name _` before this,
# because a more specific name wins. Remove it once nobody is reaching for the old address.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name 167.233.250.233;

    return 301 https://ester.troinvest.uk$request_uri;
}
