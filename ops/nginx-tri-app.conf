# The reverse proxy in front of TRi, as deployed. Install to
# /etc/nginx/sites-available/tri-app, symlink into sites-enabled, `nginx -t`, reload.
#
# This file is in the repository because it drifted from `caddy/Caddyfile` the moment it
# stopped being in the repository. The Caddyfile is the same proxy for the compose stack, and
# it carries three protections this one had lost — each written down there with the reason.
# Nothing warns you when they disagree: the site serves 200s either way, and what changes is
# who gets to choose the tenant and whose address ends up in the audit trail. Change one, read
# the other.
#
# There is no TLS here yet. The app is served over plain HTTP on an IP address, which means
# the session cookie cannot carry `Secure` and the password crosses the network in the clear.
# That needs a domain name before it can be fixed; it is the largest open item in the audit.

server {
    listen 80;
    listen [::]:80;
    server_name 167.233.250.233;

    # The on-demand TLS "ask" endpoint answers 200 for an active tenant domain and 404 for
    # anything else, which makes it a client-enumeration oracle for anyone who can reach it.
    # It exists for Caddy, which calls it over the compose network and never through a proxy.
    # Nothing on the public internet has any business asking. Blocked before `location /`
    # because a prefix match here beats the generic one.
    location /api/tls/allow {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;

        # $remote_addr is the socket peer and cannot be forged. $proxy_add_x_forwarded_for —
        # nginx's usual answer, and what this used to send — *appends* to whatever the client
        # already put in X-Forwarded-For, so a caller could prepend any address they liked and
        # have it read back as theirs. `clientIp()` prefers X-Real-IP and so kept its rate
        # limits, but `startSession` takes the first hop of X-Forwarded-For for the address it
        # files against the session, and that entry was the caller's to write.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Overwrite, never pass through. `getRequestHost()` reads X-Forwarded-Host to decide
        # which tenant a request belongs to and whether it reached the operator console's
        # hostname; nginx forwards unrecognised client headers verbatim, so without this line
        # the caller chose both by sending the header themselves.
        proxy_set_header X-Forwarded-Host $host;
    }
}
