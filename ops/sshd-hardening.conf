# Keys only. Install to /etc/ssh/sshd_config.d/99-tri-hardening.conf.
#
# This box was taking about 7,700 password guesses against root per day, from
# 70 addresses, with nothing rate-limiting them and password authentication
# switched on. Nobody had got in, and nothing in the app would have told us if
# they had: root on this machine is the trading book, the encrypted MT5
# credentials, the ENCRYPTION_KEY that opens them sitting in the same .env, and
# every nightly backup.
#
# Two keys open this machine now. The deploy key is pinned to a forced command
# in /root/.ssh/authorized_keys and can do nothing but run tri-deploy; the other
# is Omer's. If both are ever lost the way in is the Hetzner rescue console, and
# the root password in ops/.secrets.env is for that and nothing else — sshd will
# not accept it.
#
# Watch the include order. Ubuntu's cloud-init drops
# /etc/ssh/sshd_config.d/50-cloud-init.conf with "PasswordAuthentication yes",
# it sorts before this file, and sshd takes the *first* occurrence of a keyword
# — so this file alone could not turn passwords off, and `sshd -T` still said
# yes while `AuthenticationMethods publickey` quietly did the refusing. Both
# files are set now. A policy that holds only because one directive out-argues
# another file is one edit away from silently reopening.
#
# Verify with `sshd -T`, never by reading this file:
#
#     sshd -T | grep -E 'passwordauthentication|permitrootlogin|authenticationmethods'

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
AuthenticationMethods publickey

# Nothing here needs a tunnel through this host.
AllowTcpForwarding no
X11Forwarding no
