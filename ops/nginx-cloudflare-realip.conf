# Cloudflare's addresses, so nginx can recover the visitor's real one.
#
# Install to /etc/nginx/conf.d/cloudflare-realip.conf. It is included automatically by the
# main nginx.conf's `include /etc/nginx/conf.d/*.conf` and applies to every server block.
#
# WHY THIS IS NOT OPTIONAL HERE
#
# With Cloudflare in front, the TCP peer is Cloudflare, so `$remote_addr` is one of the
# addresses below on every single request. Three things in TRi read the client address and
# all three break the same way:
#
#   - the sign-in rate limiter is per-IP. Every visitor sharing one apparent address means the
#     limit is either tripped by strangers or never trips at all;
#   - the same limiter runs per-IP on the MT5 connect action;
#   - the audit trail records who did what from where, and would record Cloudflare.
#
# `real_ip_header CF-Connecting-IP` tells nginx to trust that header — but only when the
# request actually arrived from one of the ranges listed here. That last part is the whole
# security of it: without `set_real_ip_from`, anyone could send a CF-Connecting-IP header of
# their choosing and rotate it to defeat every per-IP limit in the app.
#
# The ranges are published by Cloudflare and do change. Refresh with:
#
#   curl -s https://www.cloudflare.com/ips-v4
#   curl -s https://www.cloudflare.com/ips-v6
#
# Fetched 2026-08-09.

real_ip_header CF-Connecting-IP;

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
