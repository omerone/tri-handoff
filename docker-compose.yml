services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tri}
      # No default: production must set this. A weak default on a published port is how a
      # whole multi-tenant database walks out of the building.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tri}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only. The app reaches Postgres over the compose network as `postgres:5432`;
      # this mapping exists solely so migrations and psql work from the host.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tri} -d ${POSTGRES_DB:-tri}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # === Database ===
      DATABASE_URL: postgresql://${POSTGRES_USER:-tri}:${POSTGRES_PASSWORD:-tri}@postgres:5432/${POSTGRES_DB:-tri}?schema=public

      # === Secrets Management ===
      # Production: Set AWS_REGION to enable AWS Secrets Manager
      # Local: Leave AWS_REGION unset to use .env.local or environment variables
      # AWS_REGION: us-east-1
      AWS_SECRETS_NAME: ${AWS_SECRETS_NAME:-tri/secrets}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

      # Fallback to environment variables if secrets manager is not available
      # These are populated from .env in docker-compose up (local development)
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # === MT5 Broker ===
      MT5_PROVIDER: ${MT5_PROVIDER:-mock}
      METAAPI_TOKEN: ${METAAPI_TOKEN:-}
      METAAPI_REGION: ${METAAPI_REGION:-new-york}

      # === Email ===
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-TRi <no-reply@example.com>}

      # === Market Data ===
      FX_API_URL: ${FX_API_URL:-https://api.frankfurter.app}

      # === App Configuration ===
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN}
      APP_PROTOCOL: ${APP_PROTOCOL:-https}
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    ports:
      # Loopback only. `0.0.0.0` here put the app itself on the public internet beside the
      # proxy, and everything that makes a request trustworthy is a header the proxy writes:
      # nginx overwrites X-Real-IP with the socket peer and X-Forwarded-Host with the real
      # host, and the app reads both. Reached directly on this port the caller wrote them,
      # which means a fresh rate-limit bucket per request and a free choice of which tenant —
      # and of whether the request looks like it arrived on the operator's hostname.
      #
      # `HOSTNAME: 0.0.0.0` above is unrelated and correct: that is the interface the server
      # binds *inside* the container, where reaching it still means going through this line.
      - '127.0.0.1:3000:3000'
    # For local development with AWS Secrets Manager emulator:
    # Uncomment the volumes section and start LocalStack
    # volumes:
    #   - ./.env.local:/app/.env.local:ro

  # Caddy terminates TLS and obtains a certificate per tenant domain automatically.
  # Adding a client = adding their domain to caddy/Caddyfile (or the on-demand TLS ask
  # endpoint, which validates the host against the tenants table).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Local-only mail catcher for testing the password-reset flow.
  mailhog:
    image: axllent/mailpit:latest
    profiles: ['dev']
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
  caddy_data:
  caddy_config:
